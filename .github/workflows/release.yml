name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # 不設 release-type：給了它就走單一策略、不讀 release-please-config.json，
      # bump-minor-pre-major 與 manifest 釘住的版號會靜默失效（首次跑就是這樣
      # 被判成 1.0.0 的）。config 與 manifest 用的是 action 的預設檔名。
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

    # 單一 root component 才有這兩個沒有 path 前綴的 output
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  publish:
    name: Publish to npm
    if: ${{ needs.release-please.outputs.release_created }}
    needs: release-please

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm trusted publishing 的 OIDC token

    steps:
      # 釘 tag 而非 main：release PR 合併後若又有人推 main，發出去的會是沒被 tag 的碼
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # trusted publishing 要 npm >= 11.5.1；不靠 node image 內建的剛好夠新
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # 不設 NODE_AUTH_TOKEN：有 token 時 npm 會走 token 而不是 OIDC。
      # 沒有 build 步驟也沒有 runtime 依賴，所以不需要先 install。
      - name: Publish
        run: npm publish
