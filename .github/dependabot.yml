# 沒有 package-ecosystem: bun：updater image 的 bun 讀不了 lockfileVersion 2 的 bun.lock，
# job 會失敗。解除條件見 dependabot/dependabot-core#15897。
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: 'chore(ci)'
    # 避開剛發佈就被汙染／撤回的版本
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
